name: ci

on:
  push:
    branches: [llm, master]
  pull_request:
  workflow_dispatch:

jobs:
  haskell-build:
    name: stack build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          enable-stack: true
          stack-no-global: true
          stack-setup-ghc: true

      - name: Cache stack
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.stack-root }}
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml.lock') }}-${{ hashFiles('sc-mini.cabal') }}
          restore-keys: |
            stack-${{ runner.os }}-${{ hashFiles('stack.yaml.lock') }}-
            stack-${{ runner.os }}-

      - run: stack build --no-run-tests --test

  lean-roundtrip:
    name: lean roundtrip
    runs-on: ubuntu-latest
    needs: haskell-build
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          enable-stack: true
          stack-no-global: true
          stack-setup-ghc: true

      - name: Cache stack
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.stack-root }}
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml.lock') }}-${{ hashFiles('sc-mini.cabal') }}
          restore-keys: |
            stack-${{ runner.os }}-${{ hashFiles('stack.yaml.lock') }}-
            stack-${{ runner.os }}-

      # LeanCheck.hs hardcodes $HOME/.elan/bin/lake, so elan must live there.
      # Cache restore happens at this step; install/toolchain steps are
      # idempotent, so a cache hit makes them no-ops.
      - name: Cache elan + toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-lean4-v4.29.1

      - name: Install elan (if not cached)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # No explicit toolchain install: setupProject in LeanCheck.hs writes
      # a lean-toolchain file pinning leanprover/lean4:v4.29.1, and elan
      # auto-installs on the first `lake build`.
      - run: stack test sc-mini:lean-roundtrip
